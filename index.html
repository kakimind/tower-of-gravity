<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>중력의 탑</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --night-950: #150f26;
      --night-900: #1e1638;
      --night-800: #2c1f4a;
      --parchment: #f3e6c8;
      --parchment-edge: #c9a869;
      --ink: #3a2a58;
      --gold: #e8b64f;
      --violet: #9b6bff;
      --shadow-ink: rgba(10, 6, 24, 0.55);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      color: var(--parchment);
      background:
        radial-gradient(ellipse 620px 420px at 50% -6%, rgba(155,107,255,0.28) 0%, rgba(155,107,255,0) 70%),
        radial-gradient(circle 2px at 12% 18%, #fff 0%, transparent 100%),
        radial-gradient(circle 1.5px at 24% 42%, #fff 0%, transparent 100%),
        radial-gradient(circle 2px at 82% 14%, #fff 0%, transparent 100%),
        radial-gradient(circle 1.5px at 90% 38%, #fff 0%, transparent 100%),
        radial-gradient(circle 1.5px at 68% 8%, #fff 0%, transparent 100%),
        radial-gradient(circle 2px at 8% 70%, #fff 0%, transparent 100%),
        radial-gradient(circle 1.5px at 94% 68%, #fff 0%, transparent 100%),
        linear-gradient(180deg, var(--night-950) 0%, var(--night-900) 55%, var(--night-800) 100%);
    }

    .book {
      position: absolute;
      width: 40px;
      height: 28px;
      background: linear-gradient(180deg, var(--violet), #5a3aa8);
      border-radius: 3px 8px 8px 3px;
      box-shadow: 0 6px 14px var(--shadow-ink);
      opacity: 0.85;
      pointer-events: none;
    }
    .book::before {
      content: "";
      position: absolute;
      inset: 3px 3px 3px 9px;
      background: rgba(255,255,255,0.12);
      border-radius: 2px;
    }
    .book1 { top: 10%; left: 8%; transform: rotate(-14deg); }
    .book2 { top: 68%; left: 5%; transform: rotate(10deg) scale(0.85); }
    .book3 { top: 16%; right: 9%; transform: rotate(16deg); }
    .book4 { top: 62%; right: 7%; transform: rotate(-8deg) scale(0.9); }

    .candle {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffe9a8 0%, var(--gold) 55%, rgba(232,182,79,0) 75%);
      filter: blur(0.5px);
      opacity: 0.8;
      pointer-events: none;
    }
    .candle1 { top: 30%; left: 15%; }
    .candle2 { top: 45%; right: 13%; }
    .candle3 { top: 78%; left: 20%; }
    .candle4 { top: 20%; right: 20%; }

    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: min(16px, 2.2vh);
      padding: 12px;
      z-index: 1;
      width: min(488px, 94vw);
      max-height: 100vh;
      box-sizing: border-box;
      margin: auto;
    }

    .topbar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 0 12px;
    }

    .settings-btn {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(232, 182, 79, 0.14);
      border: 1.5px solid rgba(232, 182, 79, 0.45);
      border-top-color: rgba(255, 233, 168, 0.6);
      border-bottom-color: rgba(169, 130, 58, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      padding: 0;
    }
    .settings-btn .icon {
      filter: sepia(1) saturate(4) hue-rotate(-10deg) brightness(1.3);
    }
    .settings-btn:active { transform: translateY(-50%) translateY(2px); }
    .settings-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    .title-plaque {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
      max-width: calc(100% - 46px);
      overflow: hidden;
      border-radius: 999px;
      padding: 5px 18px;
      background: rgba(232, 182, 79, 0.1);
      /* Faceted bevel via differential border-edge color (lighter top,
         darker bottom) instead of a flat ring — the double-background-
         layer gradient trick used on the opaque .tray doesn't work here
         since this pill's fill is translucent and would let the opaque
         border gradient show through the whole pill, not just its edge. */
      border: 1.5px solid #e8b64f;
      border-top-color: #ffe9a8;
      border-bottom-color: #a9823a;
    }

    .title-plaque h1 {
      white-space: nowrap;
      font-family: 'Cinzel Decorative', serif;
      font-weight: 700;
      font-size: 15px;
      margin: 0;
      letter-spacing: 0.3px;
      color: var(--gold);
      text-shadow: 0 1px 2px rgba(0,0,0,0.75), 0 0 10px rgba(232,182,79,0.4);
    }

    .hud {
      display: none;
      width: 100%;
      margin-bottom: 10px;
      gap: 6px;
    }

    .badge {
      position: relative;
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 8px 4px 9px;
      min-width: 0;
      border-radius: 10px;
      background: rgba(232, 182, 79, 0.1);
      /* Same differential-border-color bevel as .title-plaque (see note
         there on why the gradient-background trick doesn't suit a
         translucent fill), kept subtle since four of these sit in a row. */
      border: 1px solid rgba(232, 182, 79, 0.45);
      border-top-color: rgba(255, 233, 168, 0.55);
      border-bottom-color: rgba(169, 130, 58, 0.5);
    }

    .badge .icon {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      filter: drop-shadow(0 0 4px rgba(232,182,79,0.6));
    }

    .badge .label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #c9bce0;
      text-transform: uppercase;
      text-shadow: 0 1px 2px rgba(0,0,0,0.7);
    }

    .badge .value {
      font-family: 'Cinzel Decorative', serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--gold);
      line-height: 1.2;
      text-shadow: 0 1px 2px rgba(0,0,0,0.75), 0 0 8px rgba(232,182,79,0.35);
      font-variant-numeric: tabular-nums;
    }

    .badge.stage .value { color: #d3bbff; text-shadow: 0 1px 2px rgba(0,0,0,0.75), 0 0 8px rgba(199,168,255,0.4); }
    .badge.moves .value { color: #ffa3b2; text-shadow: 0 1px 2px rgba(0,0,0,0.75), 0 0 8px rgba(255,143,163,0.35); }
    .badge.score .value { color: var(--gold); }
    .badge.target .value { color: #8ee89c; text-shadow: 0 1px 2px rgba(0,0,0,0.75), 0 0 8px rgba(126,224,138,0.35); }

    .tray {
      position: relative;
      border-radius: 20px;
      padding: 14px 16px 16px;
      box-shadow: 0 10px 0 #100b1f, 0 24px 36px var(--shadow-ink);
      width: 100%;
      box-sizing: border-box;
      /* Faceted gold bezel instead of a flat border: a lighter-to-darker
         gradient stroke around the panel's own fill, echoing the gem-cut
         treatment used on every button/panel inside the canvas. */
      border: 4px solid transparent;
      background-image:
        linear-gradient(180deg, #241a3f, #1a1330),
        linear-gradient(180deg, #ffe9a8 0%, #e8b64f 35%, #a9823a 55%, #e8b64f 100%);
      background-origin: border-box;
      background-clip: padding-box, border-box;
    }

    .tray::after {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 14px;
      box-shadow: inset 0 0 0 1px rgba(232,182,79,0.35);
      pointer-events: none;
    }

    #app {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* On a phone, fill the screen edge-to-edge like a native app instead of
       floating as a smaller card on top of a separate desktop backdrop. */
    @media (max-width: 640px) {
      body { align-items: stretch; justify-content: stretch; }

      .stage {
        width: 100%;
        max-height: none;
        height: 100dvh;
        padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
        gap: 8px;
        margin: 0;
      }

      .tray {
        flex: 1 1 auto;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        row-gap: 8px;
        min-height: 0;
        background: none;
        border: none;
        box-shadow: none;
        border-radius: 0;
        padding: 0;
      }

      .tray::after { display: none; }

      .topbar { grid-row: 1; }
      .hud { grid-row: 2; margin-bottom: 0; height: 92px; max-height: 92px; overflow: hidden; }
      .hud .badge { height: 100%; max-height: 92px; }
      #app {
        grid-row: 3;
        width: auto;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        align-self: center;
        justify-self: center;
      }
      .footer-hint { grid-row: 4; }

      /* These decorative books/candles are meant to float in the spare
         desktop margin around the card. On a phone the stage fills the
         whole screen, so that margin doesn't exist and they land on top
         of HUD content instead (e.g. book1 at top:10%/left:8% overlapping
         the first HUD badge). Hide them rather than repositioning, since
         there's no free space left to float them into. */
      .book, .candle { display: none; }
    }

    .footer-hint {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      font-weight: 600;
      font-style: italic;
      text-align: center;
      color: rgba(243, 230, 200, 0.75);
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      margin-top: 10px;
      white-space: pre-line;
    }

    .settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 6, 24, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .settings-overlay.open { display: flex; }

    .settings-panel {
      width: min(340px, 88vw);
      background: linear-gradient(180deg, var(--night-800), var(--night-950));
      border: 2px solid var(--parchment-edge);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }

    .settings-panel h2 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 18px;
      color: var(--gold);
      margin: 0 0 16px;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }

    .settings-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .settings-field label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      font-weight: 700;
      color: #d8cdec;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }

    .settings-field select {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      font-weight: 600;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1.5px solid rgba(232,182,79,0.5);
      background: var(--night-900);
      color: var(--parchment);
    }

    .settings-exit-btn {
      width: 100%;
      font-family: 'Cinzel Decorative', serif;
      font-size: 14px;
      font-weight: 700;
      color: #150f26;
      background: linear-gradient(180deg, #ff8f8f, #e0524f);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 3px 8px rgba(0,0,0,0.35);
      border: none;
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .settings-exit-btn[hidden] { display: none; }
    .settings-exit-btn:active {
      transform: translateY(1px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 1px 3px rgba(0,0,0,0.3);
    }

    .settings-close-btn {
      width: 100%;
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--parchment);
      background: linear-gradient(180deg, #342752, #1e1638);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 3px 8px rgba(0,0,0,0.3);
      border: 1.5px solid rgba(232,182,79,0.4);
      border-radius: 10px;
      padding: 9px;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .settings-close-btn:active {
      transform: translateY(1px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 1px 3px rgba(0,0,0,0.25);
    }

  </style>
</head>
<body>
  <div class="book book1"></div>
  <div class="book book2"></div>
  <div class="book book3"></div>
  <div class="book book4"></div>
  <div class="candle candle1"></div>
  <div class="candle candle2"></div>
  <div class="candle candle3"></div>
  <div class="candle candle4"></div>

  <div class="stage">
    <div class="tray">
      <div class="topbar">
        <div class="title-plaque">
          <h1 data-i18n="title">중력의 탑</h1>
        </div>
        <button class="settings-btn" id="settings-open-btn" aria-label="Settings" type="button"><span class="icon">⚙️</span></button>
      </div>
      <div class="hud">
        <div class="badge stage">
          <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="9" y="12" width="6" height="9" rx="1" fill="#e8b64f"/>
            <polygon points="7,12 17,12 12,4" fill="#e8b64f"/>
          </svg>
          <span class="label" data-i18n="hud.stage">탑</span><span class="value" id="hud-stage">1</span>
        </div>
        <div class="badge moves">
          <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 19L17 7" stroke="#e8b64f" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M15 5l1.4 1.4L15 7.8l-1.4-1.4z" fill="#e8b64f"/>
            <path d="M18 3.5v2.2M16.9 4.6h2.2" stroke="#e8b64f" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <span class="label" data-i18n="hud.moves">주문</span><span class="value" id="hud-moves">20</span>
        </div>
        <div class="badge score">
          <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="12,3.5 14.7,9.6 21.3,10.3 16.4,14.7 17.8,21.2 12,17.8 6.2,21.2 7.6,14.7 2.7,10.3 9.3,9.6" fill="#e8b64f"/>
          </svg>
          <span class="label" data-i18n="hud.score">마력</span><span class="value" id="hud-score">0</span>
        </div>
        <div class="badge target">
          <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="8.5" stroke="#e8b64f" stroke-width="2"/>
            <circle cx="12" cy="12" r="4.5" stroke="#e8b64f" stroke-width="2"/>
            <circle cx="12" cy="12" r="1.6" fill="#e8b64f"/>
          </svg>
          <span class="label" data-i18n="hud.target">목표</span><span class="value" id="hud-target">1000</span>
        </div>
      </div>
      <div id="app"></div>
      <div class="footer-hint" data-i18n="footerHint">재료를 원하는 방향으로 밀어서 조합하세요
· 5수마다 실패한 주문이 중력을 뒤집습니다</div>
    </div>
  </div>

  <div class="settings-overlay" id="settings-overlay">
    <div class="settings-panel">
      <h2 data-i18n="settings.title">설정</h2>
      <div class="settings-field">
        <label for="settings-language" data-i18n="settings.language">언어</label>
        <select id="settings-language"></select>
      </div>
      <button class="settings-exit-btn" id="settings-exit-btn" data-i18n="settings.exit" hidden>나가기</button>
      <button class="settings-close-btn" id="settings-close-btn" data-i18n="settings.close">닫기</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
